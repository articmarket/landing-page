<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIC MARKET Registration</title>
    
    <!-- Original Fonts (Strictly preserved for Page 3 layout security) -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Newest Premium Sleek App Fonts (For Page 1 & Page 2) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- DM Sans strictly for the newly imported input form styling -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Canvas Confetti for Celebration Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f9f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Safe Typography Classes Explicit to Zones */
        .font-display { font-family: 'Anton', sans-serif; }
        .font-heading-new { font-family: 'Outfit', sans-serif; } 
        .font-body-new { font-family: 'Plus Jakarta Sans', sans-serif; } 

        .bg-pattern {
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(250, 204, 21, 0.05) 0%, transparent 20%);
        }

        .page-transition {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
        }

        .hidden-page {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            pointer-events: none;
            visibility: hidden;
            z-index: 0;
        }

        .visible-page {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            visibility: visible;
            z-index: 10;
        }

        .texture {
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        /* Native fix dropping the auto-yellow fields from Chrome saves aesthetics on autofill forms */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 50px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
            font-family: 'DM Sans', sans-serif;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 25px rgba(0, 215, 87, 0.4), 0 0 0 0 rgba(0, 215, 87, 0.6); }
            70% { box-shadow: 0 10px 25px rgba(0, 215, 87, 0.4), 0 0 0 15px rgba(0, 215, 87, 0); }
            100% { box-shadow: 0 10px 25px rgba(0, 215, 87, 0.4), 0 0 0 0 rgba(0, 215, 87, 0); }
        }
        .btn-pulse {
            animation: pulseGlow 2s infinite;
        }

        /* =========================================
           NEW FORM FIELD UI STYLES FOR PAGE 2
           ========================================= */
        :root {
            --green: #16a34a;
            --green-light: #22c55e;
            --yellow: #facc15;
            --white: #ffffff;
            --ink: #0f1a0d;
        }

        .field { position: relative; width: 100%; opacity: 0; } /* Initial opacity 0 for GSAP */
        
        .field-inner {
            position: relative; height: 68px; background: #f8faf8; border-radius: 16px; border: 1.5px solid #e5e9e5;
            display: flex; align-items: center; overflow: hidden; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; cursor: text;
        }
        .field-inner:focus-within { border-color: var(--green-light); background: #fff; box-shadow: 0 0 0 4px rgba(34,197,94,0.1); }

        .field-icon { width: 52px; height: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .field-icon svg { color: #9ca3af; transition: color 0.2s; }
        .field-inner:focus-within .field-icon svg { color: var(--green); }

        .field-phone-prefix {
            display: flex; align-items: center; gap: 6px; padding: 0 14px 0 18px; height: 100%;
            border-right: 1.5px solid #e5e9e5; flex-shrink: 0; transition: border-color 0.2s;
        }
        .field-inner:focus-within .field-phone-prefix { border-color: #c8e6c9; }
        .field-phone-prefix img { width: 20px; height: auto; border-radius: 2px; }
        .field-phone-prefix span { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0.02em; font-family: 'DM Sans', sans-serif;}

        .field-content { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; overflow: hidden; }

        label.float-label {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 500;
            color: #9ca3af; pointer-events: none; transition: top 0.2s, font-size 0.2s, color 0.2s, transform 0.2s;
            transform-origin: left center; z-index: 2; letter-spacing: 0.01em; font-family: 'DM Sans', sans-serif;
        }
        
        .field-content.filled label.float-label,
        .field-inner:focus-within .field-content label.float-label {
            top: 14px; font-size: 10.5px; color: var(--green); transform: translateY(0); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        }
        .field-content label.float-label.phone { left: 14px; }

        input.field-input {
            position: absolute; bottom: 0; left: 0; right: 0; height: 42px; background: transparent; border: none; outline: none;
            padding: 0 16px 8px 16px; font-size: 15.5px; font-weight: 600; color: var(--ink); font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.01em; z-index: 1; width: 100%;
        }
        input.field-input.phone { padding: 0 14px 8px 14px; }

        .field-check {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
            border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; flex-shrink: 0;
        }
        .field-check.visible { opacity: 1; }
        .field-check svg { color: white; }

        .submit-btn {
            width: 100%; height: 64px; background: var(--ink); color: var(--white); border: none; border-radius: 16px;
            font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.25s ease;
            opacity: 0; /* Initial opacity 0 for GSAP */
        }
        @media(min-width: 768px) { .submit-btn { height: 68px; font-size: 18px; } }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,26,13,0.4); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn .btn-badge {
            width: 24px; height: 24px; border-radius: 8px; background: var(--yellow);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .submit-btn .btn-badge svg { color: var(--ink); width: 13px; height: 13px; }

        .trust-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; opacity: 0; /* Margin adjusted, Initial opacity 0 for GSAP */ }
        .trust-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #9ca3af; font-weight: 600; font-family: 'DM Sans', sans-serif; }
        .trust-item svg { color: var(--green-light); flex-shrink: 0; }

        /* =========================================
           PAGE 3 WA BUTTON (Kept for CSS safety)
           ========================================= */
        .whatsapp-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 0 24px; height: 50px;
            border: none; border-radius: 40px; cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #00d757; font-family: 'Inter', sans-serif;
            margin: 0 auto; z-index: 1;
        }
        .whatsapp-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-25deg); transition: all 0.6s ease; z-index: -1;
        }
        .whatsapp-btn:hover {
            transform: translateY(-3px); background-color: #00e65c;
            animation-play-state: paused;
            box-shadow: 0 12px 25px rgba(0, 215, 87, 0.5), 0 0 0 6px rgba(0, 215, 87, 0.1) !important;
        }
        .whatsapp-btn:hover::after { left: 120%; }
        .whatsapp-btn:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(0, 215, 87, 0.4) !important; }
        
        .whatsapp-icon {
            width: 22px; height: 22px; fill: white;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .whatsapp-btn:hover .whatsapp-icon { transform: scale(1.15) rotate(-8deg); }
        .whatsapp-text { color: white; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; text-transform: capitalize; white-space: nowrap; }
    </style>
</head>
<body class="bg-pattern">
    
    <!-- Stable Render Core -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-cover bg-center transition-all duration-700" 
             style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=1920&h=1080'); filter: brightness(0.9);">
        </div>
        <div class="absolute inset-0 texture pointer-events-none"></div>
    </div>

    <!-- Absolutely Zero Layout Breaking Stacker Code Block -->
    <div class="relative z-10 grid w-full place-items-center" style="min-height: 100vh;">
        
        <!-- ================= FORM PAGE ================= -->
        <div id="page-form" class="font-body-new page-transition visible-page w-full h-full min-h-[100dvh] flex flex-col justify-center items-center py-10 px-5 relative" style="grid-area: 1/1;">
            
            <!-- Protected Premium Original Clean Floater Saved -->
            <div class="fixed top-5 left-5 sm:top-8 sm:left-8 z-[100] gsap-back-btn">
                <button class="group flex items-center justify-center w-12 h-12 md:w-14 md:h-14 bg-white rounded-full shadow-[0_12px_24px_rgba(0,0,0,0.2)] transition-all hover:bg-gray-100 active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-gray-800 transition-transform duration-300 group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

            <!-- Parent Wrapper intact untouched to preserve layout exactly! Only bottom padding tweaked to 53px desktop. -->
            <div class="w-full max-w-[520px] bg-white rounded-[32px] md:rounded-[40px] px-7 pt-14 pb-[48px] md:px-12 md:pt-[75px] md:pb-[53px] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.7)] flex flex-col relative mt-10 sm:mt-0 gsap-card mx-auto">
                
                <div class="mb-[36px] w-full text-center">
                    <h2 class="font-heading-new text-4xl md:text-[46px] font-black tracking-[-0.01em] leading-none">
                        <span class="text-[#22c55e] uppercase">ARTIC</span> <span class="text-[#facc15] uppercase">MARKET</span>
                    </h2>
                    <p class="text-gray-500 text-[14.5px] md:text-[16px] font-semibold mt-4 max-w-[320px] mx-auto leading-relaxed">Secure your lifetime wholesale access code.</p>
                </div>
                
                <form id="regForm" onsubmit="event.preventDefault();" class="w-full space-y-[18px]">
                    
                    <!-- NEW UI Field 1: Name -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <div class="field-content" id="fc-name">
                                <label class="float-label" for="fname">FULL NAME</label>
                                <input class="field-input" type="text" id="fname" required autocomplete="name" oninput="handleInput(this,'fc-name')">
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 2: Phone -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-phone-prefix">
                                <img src="https://flagcdn.com/in.svg" alt="India" loading="lazy">
                                <span>+91</span>
                            </div>
                            <div class="field-content" id="fc-phone">
                                <label class="float-label phone" for="fphone">MOBILE NUMBER</label>
                                <input class="field-input phone" type="tel" id="fphone" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" oninput="handleInput(this,'fc-phone','chk-phone');this.value=this.value.replace(/\D/g,'')">
                            </div>
                            <div class="field-check" id="chk-phone">
                                <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 3: City -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            </div>
                            <div class="field-content" id="fc-place">
                                <label class="float-label" for="fplace">CITY / TOWN</label>
                                <input class="field-input" type="text" id="fplace" required autocomplete="address-level2" oninput="handleInput(this,'fc-place')">
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 4: Submit Button & Secure Text -->
                    <div class="pt-8 w-full">
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span>Complete Registration</span>
                            <div class="btn-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                        </button>
                        
                        <div class="trust-row">
                            <div class="trust-item">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                Secure & Encrypted
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <script>
        // NEW Form UI Script
        function handleInput(input, fcId, chkId) {
            const fc = document.getElementById(fcId);
            const chk = chkId ? document.getElementById(chkId) : null;
            
            if (input.value.trim().length > 0) {
                fc.classList.add('filled');
                if (chk) {
                    const valid = input.type === 'tel' ? /^[0-9]{10}$/.test(input.value) : input.value.trim().length >= 2;
                    chk.classList.toggle('visible', valid);
                }
            } else {
                fc.classList.remove('filled');
                if (chk) chk.classList.remove('visible');
            }
        }

        // Auto-initialize form page animations directly since it's the only page left
        window.addEventListener('DOMContentLoaded', () => {
            // Card entrance
            gsap.fromTo("#page-form .gsap-card", 
                { opacity: 0, y: 50, scale: 0.98 }, 
                { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out", delay: 0.1 }
            );
            
            // --- NEW GSAP ENTRANCE ANIMATIONS (Staggered Fields, Button, Secure text) ---
            
            // Animate Inputs (clearProps ensures external CSS hover/focus works after completion)
            gsap.fromTo(".field", 
                { opacity: 0, x: -16 }, 
                { opacity: 1, x: 0, duration: 0.55, stagger: 0.09, ease: "power2.out", delay: 0.25, clearProps: "transform" }
            );

            // Animate Submit Button (clearProps: "transform" explicitly preserves the CSS button hover scale/translation!)
            gsap.fromTo(".submit-btn", 
                { opacity: 0, y: 16 }, 
                { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", delay: 0.55, clearProps: "transform" }
            );

            // Animate Secure Text
            gsap.fromTo(".trust-row", 
                { opacity: 0, y: 16 }, 
                { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", delay: 0.65, clearProps: "transform" }
            );
            
            // Back Button
            gsap.fromTo(".gsap-back-btn", 
                { opacity: 0, scale: 0.5, x: -10, rotation: -20 }, 
                { opacity: 1, scale: 1, x: 0, rotation: 0, duration: 0.8, ease: "back.out(1.5)", delay: 0.35 }
            );
        });
    </script>
</body>
</html>
