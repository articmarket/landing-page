<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ARTIC MARKET Registration</title>
    
    <!-- Newest Premium Sleek App Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f9f6;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-heading-new { font-family: 'Outfit', sans-serif; } 
        .font-body-new { font-family: 'Plus Jakarta Sans', sans-serif; } 

        .bg-pattern {
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(250, 204, 21, 0.05) 0%, transparent 20%);
        }

        .texture {
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        /* Native fix dropping the auto-yellow fields from Chrome saves aesthetics on autofill forms */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 50px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
            font-family: 'DM Sans', sans-serif;
        }

        /* Remove default OS styling for native premium feel */
        input, button {
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        /* Hide scrollbar for sleekness but allow scrolling */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* =========================================
           FLUID FORM FIELD UI STYLES 
           ========================================= */
        :root {
            --green: #16a34a;
            --green-light: #22c55e;
            --yellow: #facc15;
            --white: #ffffff;
            --ink: #0f1a0d;
        }

        .field { position: relative; width: 100%; opacity: 0; }
        
        .field-inner {
            position: relative; 
            height: clamp(56px, 12vw, 68px); 
            background: #f8faf8; 
            border-radius: clamp(12px, 3.5vw, 16px); 
            border: 1.5px solid #e5e9e5;
            display: flex; align-items: center; overflow: hidden; 
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; cursor: text;
        }
        .field-inner:focus-within { border-color: var(--green-light); background: #fff; box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }

        .field-icon { width: clamp(44px, 11vw, 52px); height: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .field-icon svg { width: clamp(18px, 4.5vw, 20px); height: clamp(18px, 4.5vw, 20px); color: #9ca3af; transition: color 0.2s; }
        .field-inner:focus-within .field-icon svg { color: var(--green); }

        .field-phone-prefix {
            display: flex; align-items: center; gap: 6px; 
            padding: 0 clamp(10px, 2.5vw, 14px) 0 clamp(14px, 3.5vw, 18px); 
            height: 100%; border-right: 1.5px solid #e5e9e5; flex-shrink: 0; transition: border-color 0.2s;
        }
        .field-inner:focus-within .field-phone-prefix { border-color: #c8e6c9; }
        .field-phone-prefix img { width: clamp(18px, 4.5vw, 20px); height: auto; border-radius: 2px; }
        .field-phone-prefix span { font-size: clamp(14px, 3.5vw, 15px); font-weight: 600; color: var(--ink); letter-spacing: 0.02em; font-family: 'DM Sans', sans-serif;}

        .field-content { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; overflow: hidden; }

        label.float-label {
            position: absolute; left: clamp(12px, 3vw, 16px); top: 50%; transform: translateY(-50%); 
            font-size: clamp(13px, 3.5vw, 14px); font-weight: 500;
            color: #9ca3af; pointer-events: none; transition: top 0.2s, font-size 0.2s, color 0.2s, transform 0.2s;
            transform-origin: left center; z-index: 2; letter-spacing: 0.01em; font-family: 'DM Sans', sans-serif;
        }
        
        .field-content.filled label.float-label,
        .field-inner:focus-within .field-content label.float-label {
            top: clamp(12px, 3vw, 14px); 
            font-size: clamp(10px, 2.5vw, 10.5px); 
            color: var(--green); transform: translateY(0); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        }
        .field-content label.float-label.phone { left: clamp(12px, 3vw, 14px); }

        input.field-input {
            position: absolute; bottom: 0; left: 0; right: 0; 
            height: clamp(38px, 9vw, 42px); background: transparent; border: none; outline: none;
            padding: 0 16px clamp(6px, 1.5vw, 8px) 16px; 
            font-size: 16px; /* Lock to 16px on mobile prevents aggressive iOS Auto-Zoom */
            font-weight: 600; color: var(--ink); font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.01em; z-index: 1; width: 100%;
        }
        @media(min-width: 768px) {
            input.field-input { font-size: 15.5px; } /* Return to exact desktop specs */
        }
        input.field-input.phone { padding: 0 14px clamp(6px, 1.5vw, 8px) clamp(12px, 3vw, 14px); }

        .field-check {
            position: absolute; right: clamp(12px, 3vw, 16px); top: 50%; transform: translateY(-50%); 
            width: clamp(18px, 4.5vw, 20px); height: clamp(18px, 4.5vw, 20px);
            border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; flex-shrink: 0;
        }
        .field-check.visible { opacity: 1; }
        .field-check svg { color: white; width: clamp(10px, 2.5vw, 11px); height: clamp(10px, 2.5vw, 11px); }

        .submit-btn {
            width: 100%; height: clamp(58px, 13vw, 68px); 
            background: var(--ink); color: var(--white); border: none; border-radius: clamp(14px, 3.5vw, 16px);
            font-family: 'DM Sans', sans-serif; font-size: clamp(16px, 4vw, 18px); font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.25s ease;
            opacity: 0; touch-action: manipulation;
        }
        
        /* Mobile-safe hover states - prevents stuck hovers on touchscreens */
        @media (hover: hover) {
            .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,26,13,0.4); }
        }
        .submit-btn:active { transform: scale(0.98); box-shadow: none; }
        
        .submit-btn .btn-badge {
            width: clamp(20px, 5vw, 24px); height: clamp(20px, 5vw, 24px); border-radius: 8px; background: var(--yellow);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .submit-btn .btn-badge svg { color: var(--ink); width: clamp(11px, 2.5vw, 13px); height: clamp(11px, 2.5vw, 13px); }

        .trust-row { display: flex; align-items: center; justify-content: center; margin-top: clamp(16px, 4vw, 20px); opacity: 0; }
        .trust-item { display: flex; align-items: center; gap: 5px; font-size: clamp(11px, 2.5vw, 12px); color: #9ca3af; font-weight: 600; font-family: 'DM Sans', sans-serif; }
        .trust-item svg { width: clamp(12px, 2.5vw, 13px); height: clamp(12px, 2.5vw, 13px); color: var(--green-light); flex-shrink: 0; }
    </style>
</head>
<body class="bg-pattern">
    
    <!-- Stable Render Core -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-cover bg-center transition-all duration-700" 
             style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=1920&h=1080'); filter: brightness(0.9);">
        </div>
        <div class="absolute inset-0 texture pointer-events-none"></div>
    </div>

    <!-- Layout Container optimized for dynamic keyboard handling -->
    <div class="relative z-10 flex flex-col w-full min-h-[100dvh]">
        
        <!-- ================= FORM PAGE ================= -->
        <!-- Justify-start + my-auto gracefully allows standard scrolling natively without cutting off the top if height becomes constrained -->
        <div id="page-form" class="font-body-new w-full flex flex-col justify-start items-center pt-[clamp(88px,12vh,120px)] pb-[max(2rem,env(safe-area-inset-bottom))] px-4 sm:px-5 relative overflow-y-auto min-h-[100dvh]">
            
            <!-- Protected Premium Original Clean Floater Saved -->
            <div class="fixed top-[clamp(16px,4vh,32px)] left-[clamp(16px,4vw,32px)] z-[100] gsap-back-btn">
                <button class="group flex items-center justify-center w-[clamp(40px,10vw,56px)] h-[clamp(40px,10vw,56px)] bg-white/95 backdrop-blur-md md:bg-white rounded-full shadow-[0_8px_16px_rgba(0,0,0,0.15)] md:shadow-[0_12px_24px_rgba(0,0,0,0.2)] transition-transform hover:bg-gray-100 active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-[clamp(16px,4vw,24px)] w-[clamp(16px,4vw,24px)] text-gray-800 transition-transform duration-300 group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

            <!-- Parent Wrapper intact untouched to preserve layout perfectly fluidly! -->
            <div class="w-full max-w-[520px] bg-white rounded-[clamp(28px,6vw,40px)] px-[clamp(20px,6vw,48px)] pt-[clamp(40px,8vw,75px)] pb-[clamp(40px,8vw,53px)] shadow-[0_20px_40px_-10px_rgba(0,0,0,0.5)] md:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.7)] flex flex-col relative my-auto gsap-card mx-auto">
                
                <div class="mb-[clamp(28px,6vw,36px)] w-full text-center">
                    <h2 class="font-heading-new text-[clamp(32px,8vw,46px)] font-black tracking-[-0.01em] leading-none">
                        <span class="text-[#22c55e] uppercase">ARTIC</span> <span class="text-[#facc15] uppercase">MARKET</span>
                    </h2>
                    <p class="text-gray-500 text-[clamp(14px,3.5vw,16px)] font-semibold mt-[clamp(12px,2.5vw,16px)] max-w-[320px] mx-auto leading-relaxed">Secure your lifetime wholesale access code.</p>
                </div>
                
                <!-- Converted to flex+gap so it scales vertically uniformly across breakpoints -->
                <form id="regForm" onsubmit="event.preventDefault();" class="w-full flex flex-col gap-[clamp(14px,3vw,18px)]">
                    
                    <!-- NEW UI Field 1: Name (No Checkmark) -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-icon">
                                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <div class="field-content" id="fc-name">
                                <label class="float-label" for="fname">FULL NAME</label>
                                <input class="field-input" type="text" id="fname" required autocomplete="name" oninput="handleInput(this,'fc-name')">
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 2: Phone (With Checkmark) -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-phone-prefix">
                                <img src="https://flagcdn.com/in.svg" alt="India" loading="lazy">
                                <span>+91</span>
                            </div>
                            <div class="field-content" id="fc-phone">
                                <label class="float-label phone" for="fphone">MOBILE NUMBER</label>
                                <input class="field-input phone" type="tel" id="fphone" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" oninput="handleInput(this,'fc-phone','chk-phone');this.value=this.value.replace(/\D/g,'')">
                            </div>
                            <div class="field-check" id="chk-phone">
                                <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 3: City (No Checkmark) -->
                    <div class="field">
                        <div class="field-inner">
                            <div class="field-icon">
                                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            </div>
                            <div class="field-content" id="fc-place">
                                <label class="float-label" for="fplace">CITY / TOWN</label>
                                <input class="field-input" type="text" id="fplace" required autocomplete="address-level2" oninput="handleInput(this,'fc-place')">
                            </div>
                        </div>
                    </div>

                    <!-- NEW UI Field 4: Submit Button & Secure Text -->
                    <div class="pt-[clamp(16px,4vw,32px)] w-full">
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span>Complete Registration</span>
                            <div class="btn-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                        </button>
                        
                        <div class="trust-row">
                            <div class="trust-item">
                                <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                Secure & Encrypted
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <script>
        // NEW Form UI Script
        function handleInput(input, fcId, chkId) {
            const fc = document.getElementById(fcId);
            const chk = chkId ? document.getElementById(chkId) : null;
            
            if (input.value.trim().length > 0) {
                fc.classList.add('filled');
                if (chk) {
                    const valid = input.type === 'tel' ? /^[0-9]{10}$/.test(input.value) : input.value.trim().length >= 2;
                    chk.classList.toggle('visible', valid);
                }
            } else {
                fc.classList.remove('filled');
                if (chk) chk.classList.remove('visible');
            }
        }

        // Auto-initialize form page animations safely maintaining responsive classes post-animation
        window.addEventListener('DOMContentLoaded', () => {
            gsap.fromTo(".gsap-card", 
                { opacity: 0, y: 50, scale: 0.98 }, 
                { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out", delay: 0.1 }
            );
            
            gsap.fromTo(".field", 
                { opacity: 0, x: -16 }, 
                { opacity: 1, x: 0, duration: 0.55, stagger: 0.09, ease: "power2.out", delay: 0.25, clearProps: "transform" }
            );

            gsap.fromTo(".submit-btn", 
                { opacity: 0, y: 16 }, 
                { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", delay: 0.55, clearProps: "transform" }
            );

            gsap.fromTo(".trust-row", 
                { opacity: 0, y: 16 }, 
                { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", delay: 0.65, clearProps: "transform" }
            );
            
            gsap.fromTo(".gsap-back-btn", 
                { opacity: 0, scale: 0.5, x: -10, rotation: -20 }, 
                { opacity: 1, scale: 1, x: 0, rotation: 0, duration: 0.8, ease: "back.out(1.5)", delay: 0.35 }
            );
        });
    </script>
</body>
</html>
